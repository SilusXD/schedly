name: schedly
description: "Schedly — расписание занятий: загрузка и разбор PDF-расписания, offline-first дневник для iPhone."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # HTTP-клиент: HEAD/GET расписания, WebDAV, запросы в S3-совместимое хранилище.
  http: ^1.2.0

  # Управление состоянием (ChangeNotifier + Provider).
  provider: ^6.1.0

  # Локальный кэш расписаний, заметок и настроек (offline-first).
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.2.0

  # Каталоги приложения на iOS (Documents/Application Support).
  path_provider: ^2.1.0

  # SHA-256 и HMAC для подписи запросов AWS SigV4 (S3-совместимое хранилище).
  crypto: ^3.0.6

  # Разбор XML-ответов WebDAV (PROPFIND) и генерация тел запросов.
  xml: ^6.5.0

  # Русские даты и время. Версию задаёт flutter_localizations, чтобы не ловить конфликт пинов.
  intl: any

  # Определение состояния сети для баннера «Оффлайн-режим».
  connectivity_plus: ^6.1.0

  # Хранение секретов облачного хранилища в iOS Keychain.
  flutter_secure_storage: ^9.2.2

  # Извлечение текста из PDF через PDFium (нативный быстрый путь).
  pdfrx: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Разбор YAML: тесты проверяют корректность workflow-файлов GitHub Actions
  # (сами экшены локально не запускаются).
  yaml: ^3.1.2

flutter:
  uses-material-design: true
